:root{--bg:#090909;--surface:#111;--border:#252525;--accent:#d7d1c5;--accent2:#7dd3a4;--text:#f4f1ea;--muted:#9c968b}
body{background:var(--bg);color:var(--text);font-family:'Mulish',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;letter-spacing:0;overflow-x:hidden}
header{width:100%;max-width:1040px;padding:58px 20px 0}
.label{font-family:'Unbounded',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:18px}
h1{font-family:'Unbounded',sans-serif;max-width:760px;font-size:clamp(2.4rem,6vw,5.4rem);font-weight:900;line-height:.98;color:var(--text);margin-bottom:12px}
main{width:100%;max-width:1040px;padding:0 20px 80px}
.semester-block{margin-top:46px;margin-bottom:48px}
.semester-header{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.semester-badge{font-family:'Unbounded',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.semester-line{flex:1;height:1px;background:var(--border)}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.subject-card{display:block;min-height:168px;text-decoration:none;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:22px;transition:border-color .16s,transform .16s,background .16s;position:relative;overflow:hidden}
.subject-card:hover{border-color:#6d675f;transform:translateY(-2px);background:#151515}
.card-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:#181818;border:1px solid #2c2c2c;font-size:23px;margin-bottom:24px}
.card-title{font-family:'Unbounded',sans-serif;font-size:clamp(14px,1.08vw,16px);font-weight:700;line-height:1.35;color:var(--text);margin-bottom:6px}
.card-meta{font-size:13px;line-height:1.5;color:var(--muted)}
.card-arrow{position:absolute;top:18px;right:18px;font-size:18px;color:var(--muted);transition:color .16s}
.subject-card:hover .card-arrow{color:var(--text)}
footer{color:#5f5a54;font-size:12px;padding-bottom:32px}

@media(max-width:900px){
  body{padding-left:0 !important}
  body::before,body::after,header::before,header::after,
  .label::before,.label::after{display:none !important}

  header{padding:14px 14px 0 !important;width:100% !important;max-width:none !important}

  .label{font:400 13px Arial,sans-serif !important;color:var(--plt-muted) !important;letter-spacing:0 !important;margin:0 0 8px !important}

  h1{font-family:Arial,sans-serif !important;font-size:20px !important;font-weight:700 !important;color:var(--plt-blue) !important;margin:0 0 14px !important;line-height:1.3 !important}

  main{max-width:none !important;width:100% !important;padding:0 0 70px !important}

  /* Семестровый блок — убираем карточку, делаем плоским */
  .semester-block{background:transparent !important;border:0 !important;box-shadow:none !important;border-radius:0 !important;padding:0 !important;margin:0 !important}

  .semester-header{padding:10px 14px 8px !important;margin:0 0 2px !important;background:var(--plt-panel) !important;border-bottom:1px solid var(--plt-border) !important;gap:12px !important}

  .semester-badge{font:700 14px Arial,sans-serif !important;color:var(--plt-blue) !important;text-transform:none !important;letter-spacing:0 !important}

  .semester-line{background:var(--plt-border) !important}

  /* Карточки — список строк */
  .subjects{display:flex !important;flex-direction:column !important;gap:0 !important;grid-template-columns:unset !important}

  .subject-card{
    display:flex !important;align-items:center !important;
    min-height:unset !important;height:68px !important;
    background:var(--plt-panel) !important;
    border:0 !important;border-bottom:1px solid var(--plt-border) !important;border-radius:0 !important;
    padding:0 14px !important;
    position:relative !important;transform:none !important;
  }
  .subject-card:hover,.subject-card:active{background:#e4e1dc !important;transform:none !important}
  html[data-plt-theme="dark"] .subject-card{background:var(--plt-panel) !important;border-color:#3c4248 !important}
  html[data-plt-theme="dark"] .subject-card:active{background:#30353a !important}

  /* Иконка */
  .card-icon{
    width:38px !important;height:38px !important;
    display:flex !important;align-items:center !important;justify-content:center !important;
    background:#edeae6 !important;border:1px solid #d8d5cf !important;border-radius:8px !important;
    font-size:20px !important;
    margin:0 13px 0 0 !important;
    flex-shrink:0;vertical-align:unset !important;
  }
  html[data-plt-theme="dark"] .card-icon{background:#30353a !important;border-color:#3c4248 !important}

  /* Текст */
  .card-title{
    display:block !important;
    font:700 15px Arial,sans-serif !important;
    color:var(--plt-text) !important;
    margin:0 0 2px !important;line-height:1.3 !important;
    vertical-align:unset !important;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-meta{display:block !important;font:400 12px Arial,sans-serif !important;color:var(--plt-muted) !important;margin:0 !important;line-height:1.3 !important}

  /* Стрелка */
  .card-arrow{display:flex !important;position:static !important;font-size:18px !important;color:#bbb !important;margin-left:auto;flex-shrink:0}

  /* Кнопка темы */
  .theme-toggle{position:fixed !important;right:14px !important;top:14px !important;height:34px !important;padding:0 12px !important;font-size:12px !important;z-index:100}

  /* Footer */
  footer{position:fixed !important;left:0 !important;right:0 !important;bottom:0 !important;background:#dedbd6 !important;color:#6d7f91 !important;text-align:center !important;padding:9px 0 !important;font-size:11px !important;z-index:50 !important}
  html[data-plt-theme="dark"] footer{background:#1c1f22 !important;color:#9ca8b3 !important}
}</style>
</head>
<body>

  <header>
    <p class="label">67</p>
    <h1>Учебные материалы и тесты</h1>
  </header>

  <main>

    <div class="semester-block">
      <div class="semester-header">
        <span class="semester-badge">1 курс · 2 семестр</span>
        <div class="semester-line"></div>
      </div>
      <div class="subjects">

        <a href="physicss67.html" class="subject-card">
          <span class="card-icon">⚛️</span>
          <div class="card-title">Физика</div>
          <div class="card-meta">Вопросы и ответы</div>
          <span class="card-arrow">→</span>
        </a>

        <a href="ikt.html" class="subject-card">
          <span class="card-icon">💻</span>
          <div class="card-title">ИКТ</div>
          <div class="card-meta">Вопросы и ответы</div>
          <span class="card-arrow">→</span>
        </a>

        <a href="ofg.html" class="subject-card">
          <span class="card-icon">💰</span>
          <div class="card-title">ОФГ</div>
          <div class="card-meta">Вопросы и ответы</div>
          <span class="card-arrow">→</span>
        </a>

        <a href="tp.html" class="subject-card">
          <span class="card-icon">🦾</span>
          <div class="card-title">Технология программирования</div>
          <div class="card-meta">Вопросы и ответы</div>
          <span class="card-arrow">→</span>
        </a>

      </div>
    </div>

    

  </main>

  <footer>© 2026 Учебник. Все права защищены.</footer>

<script>
(function(){
  function applyTheme(theme){
    document.documentElement.setAttribute('data-plt-theme',theme);
    try{localStorage.setItem('pltTheme',theme)}catch(e){}
    document.querySelectorAll('.theme-toggle').forEach(function(btn){
      btn.textContent=theme==='dark'?'Light':'Dark';
    });
  }
  document.addEventListener('DOMContentLoaded',function(){
    if(!document.querySelector('.theme-toggle')){
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='theme-toggle';
      document.body.appendChild(btn);
    }
    applyTheme(document.documentElement.getAttribute('data-plt-theme')||'light');
    document.querySelectorAll('.theme-toggle').forEach(function(btn){
      btn.addEventListener('click',function(){
        applyTheme((document.documentElement.getAttribute('data-plt-theme')||'light')==='dark'?'light':'dark');
      });
    });
  });
}());
</script>
</body>
</html>
